; Công cụ test #26: Node B giả chỉ NHẬN ESP-NOW (không MQTT, không quạt/đèn).
; Trả lời ghép cặp, đếm nhận/mất/trùng theo seq. KHÔNG phải firmware Node B thật.
[platformio]
default_envs = yolo_uno

[env:yolo_uno]
platform = espressif32@6.9.0
board = yolo_uno
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../common
