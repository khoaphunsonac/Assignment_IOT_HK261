; Node A - xem App/IOT/README.md (phần Firmware)
[platformio]
default_envs = yolo_uno

[env:yolo_uno]
; Cả 2 node dùng chung bản này: TensorFlowLite_ESP32 không build được với core 3.x
platform = espressif32@6.9.0
board = yolo_uno
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -I ../common
