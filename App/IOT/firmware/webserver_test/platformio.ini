; Webserver Node B, bản đứng riêng (issue #33).
; Giống mẫu #24, chỉ khác board: tạm dùng esp32-s3-devkitc-1 (có sẵn trong PlatformIO)
; vì boards/yolo_uno.json của #24 chưa có trong repo. Khi #24 xong thì đổi lại
; board = yolo_uno và chép thư mục boards/ sang.

[platformio]
default_envs = yolo_uno

[env:yolo_uno]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
