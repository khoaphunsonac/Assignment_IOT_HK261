; Node B - xem App/IOT/README.md (phần Firmware)
[platformio]
default_envs = yolo_uno

[env:yolo_uno]
; Cả 2 node dùng chung bản này: TensorFlowLite_ESP32 không build được với core 3.x
platform = espressif32@6.9.0
board = yolo_uno
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINOJSON_USE_LONG_LONG=1
    -I ../common
; NeoPixel + PubSubClient: cùng bản đã chạy ở lab 10/11. ArduinoJson ghim đúng bản
; Claude đã chạy 37 testcase (7.2.1), tránh bản mới đổi hành vi is<int>().
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.3
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@7.2.1
; lib/node_b_logic: logic thuần có test
test_framework = unity

; Chạy testcase logic trên PC: pio test -e native (cần gcc/g++ trong PATH, như #26)
[env:native]
platform = native
test_framework = unity
build_flags = -DARDUINOJSON_USE_LONG_LONG=1
lib_deps =
    bblanchon/ArduinoJson@7.2.1
